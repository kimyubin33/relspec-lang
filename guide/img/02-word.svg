<text x="460" y="230" font-size="13" fill="#667085" text-anchor="middle" font-weight="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR',system-ui,sans-serif" xml:space="preserve">채움 점수에서의 무게</text>
